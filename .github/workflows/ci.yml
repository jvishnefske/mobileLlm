name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`;
              console.log("## Unit test coverage (src/)\n");
              console.log("| Metric | Coverage |\n|---|---|");
              for (const k of ["lines", "statements", "functions", "branches"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (PWA, service worker, offline)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
